<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A4A4A"/>
      <stop offset="0.35" stop-color="#1E1E1E"/>
      <stop offset="0.8" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A5A5A"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E2E"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B83A"/>
      <stop offset="0.5" stop-color="#D9A425"/>
      <stop offset="1" stop-color="#B8851A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="#FFFFFF"/>

  <g transform="translate(512 512) scale(0.84) translate(-512 -512) translate(512 528) rotate(-8) translate(-512 -512)">
    <!-- Krempe, an den Seiten nach oben geschwungen -->
    <path d="M150 660 C 200 790, 824 790, 874 660 C 890 650, 882 630, 866 636 C 820 720, 204 720, 158 636 C 142 630, 134 650, 150 660 Z" fill="url(#brim)"/>
    <!-- Krempen-Oberseite (Glanz) -->
    <path d="M162 640 C 210 716, 814 716, 862 640 C 810 700, 214 700, 162 640 Z" fill="#FFFFFF" fill-opacity="0.08"/>
    <!-- Krone mit leicht konkaven Seiten, oben etwas breiter -->
    <path d="M338 700 C 356 580, 352 420, 322 292 Q 512 236 702 292 C 672 420, 668 580, 686 700 Q 512 752 338 700 Z" fill="url(#crown)"/>
    <!-- Hutband -->
    <path d="M345 648 Q 512 708 679 648 L 684 596 Q 512 654 340 596 Z" fill="url(#band)"/>
    <!-- Deckel -->
    <ellipse cx="512" cy="292" rx="190" ry="44" fill="url(#top)"/>
    <!-- Glanzlicht links -->
    <path d="M372 330 C 386 440, 384 540, 376 640" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- Schatten der Krone auf der Krempe -->
    <path d="M338 700 Q 512 752 686 700 Q 512 740 338 700 Z" fill="#000000" fill-opacity="0.45"/>
  </g>
</svg>
