name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cacht Gradle-Distribution und Abhängigkeiten zwischen Läufen, damit
      # Ausfälle der GitHub-Release-Downloads den Build nicht mehr stoppen.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Write release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/dagobert-release.jks
          {
            echo "storeFile=dagobert-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=dagobert"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Warn when unsigned
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Kein KEYSTORE_BASE64-Secret. Die APK wird mit einem Wegwerf-Debug-Key signiert, Updates lassen sich nicht über eine frühere Version installieren. Anleitung in der README."

      - name: Build APK
        # Bis zu drei Anläufe, falls Downloads (Gradle, Kotlin) kurzzeitig scheitern.
        run: |
          for i in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} && exit 0
            echo "Build-Anlauf $i fehlgeschlagen, neuer Versuch in 90 s"
            sleep 90
          done
          exit 1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "dagobert-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dagobert-apk-${{ github.run_number }}
          path: dagobert-${{ github.run_number }}.apk
          retention-days: 30
